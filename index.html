<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title>Swift Certified User — Practice Exams</title>
        <link rel="stylesheet" href="style.css" />
        <link rel="icon" href="swift.svg" />
    </head>
    <body>
        <header>
            <div>
                <h1>Swift Certified User</h1>
                <p>Practice Exams</p>
            </div>
            <div id="timer" class="hidden"></div>
        </header>
        <main>
            <section id="start" class="card">
                <h2>Choose an exam</h2>
                <p id="introMeta">Loading exam data…</p>
                <div id="buttons"></div>
                <p class="note">
                    Hard mode emphasizes tracing, optionals, state ownership,
                    collections, type relationships and debugging. Practice
                    mode gives instant feedback and has no timer; Timed Exam
                    matches real test conditions.
                </p>
            </section>
            <section id="exam" class="hidden">
                <div class="card bar">
                    <strong id="title"></strong><span id="num"></span>
                    <div class="progress"><i id="progress"></i></div>
                </div>
                <div class="layout">
                    <article class="card">
                        <small id="topic"></small>
                        <h2 id="q"></h2>
                        <div id="opts"></div>
                        <div id="explain" class="hidden"></div>
                        <div class="nav">
                            <button id="prev">Previous</button
                            ><button id="next">Next</button
                            ><button id="submit">Submit Exam</button>
                        </div>
                    </article>
                    <aside class="card">
                        <h3>Questions</h3>
                        <div id="palette"></div>
                    </aside>
                </div>
            </section>
            <section id="result" class="card hidden">
                <h2 id="resultTitle"></h2>
                <div id="score"></div>
                <div id="breakdown"></div>
                <div id="review"></div>
                <button onclick="location.reload()">Back to Exams</button>
            </section>
        </main>
        <script src="script.js"></script>
    </body>
</html>
